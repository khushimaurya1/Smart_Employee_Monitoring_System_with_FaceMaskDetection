{% extends "base.html" %}

{% block content %}

<h1>Violations</h1>

{% if violations %}
<table border="1" cellpadding="10">
	<tr>
		<th>Employee</th>
		<th>Violation Time</th>
		<th>Warning Count</th>
	</tr>
	{% for violation in violations %}
	<tr>
		<td>{{ violation[0] }}</td>
		<td>{{ violation[1] }}</td>
		<td>{{ violation[2] }}</td>
	</tr>
	{% endfor %}
</table>
{% else %}
<p>No violations recorded.</p>
{% endif %}

{% endblock %}
