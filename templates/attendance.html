{% extends "base.html" %}

{% block content %}

<h1>Attendance</h1>

{% if attendance %}
<table border="1" cellpadding="10">
	<tr>
		<th>Employee</th>
		<th>Date</th>
		<th>Time</th>
	</tr>
	{% for record in attendance %}
	<tr>
		<td>{{ record[0] }}</td>
		<td>{{ record[1] }}</td>
		<td>{{ record[2] }}</td>
	</tr>
	{% endfor %}
</table>
{% else %}
<p>No attendance records yet.</p>
{% endif %}

{% endblock %}
